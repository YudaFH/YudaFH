<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="100%" height="220">
  <rect width="1000" height="220" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="2"/>
  <text x="24" y="30" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#FDE047">SYSTEM TELEMETRY  //  CORE ENGINEERING &amp; ANALYTICS PIPELINE</text>

  <!-- Animated Data Flow Line -->
  <path id="flowPath" d="M 130 178 L 870 178" stroke="#1F2937" stroke-width="3" fill="none"/>
  <circle r="4" fill="#4ADE80">
    <animateMotion dur="3s" repeatCount="indefinite" path="M 130 178 L 870 178"/>
  </circle>
  <circle r="4" fill="#FDE047">
    <animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" path="M 130 178 L 870 178"/>
  </circle>

  <!-- Card 1 -->
  <g transform="translate(24, 48)">
    <rect width="224" height="114" rx="10" fill="#161B22" stroke="#10B981" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#4ADE80">01 // DATA &amp; BI</text>
    <text x="14" y="46" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">Python • SQL • Power BI</text>
    <text x="14" y="64" font-family="sans-serif" font-size="12" fill="#94A3B8">Looker Studio • PostgreSQL</text>
    <rect x="14" y="84" width="196" height="8" rx="4" fill="#0D1117"/>
    <rect x="14" y="84" width="182" height="8" rx="4" fill="#10B981">
      <animate attributeName="width" values="120;186;182" dur="3.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Card 2 -->
  <g transform="translate(266, 48)">
    <rect width="224" height="114" rx="10" fill="#161B22" stroke="#C94A29" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#FB923C">02 // AUTOMATION</text>
    <text x="14" y="46" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">Excel VBA • SharePoint</text>
    <text x="14" y="64" font-family="sans-serif" font-size="12" fill="#94A3B8">Make.com • GitHub Actions</text>
    <rect x="14" y="84" width="196" height="8" rx="4" fill="#0D1117"/>
    <rect x="14" y="84" width="176" height="8" rx="4" fill="#C94A29">
      <animate attributeName="width" values="110;180;176" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Card 3 -->
  <g transform="translate(508, 48)">
    <rect width="224" height="114" rx="10" fill="#161B22" stroke="#FDE047" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#FDE047">03 // FULL-STACK</text>
    <text x="14" y="46" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">Laravel • React • Next.js</text>
    <text x="14" y="64" font-family="sans-serif" font-size="12" fill="#94A3B8">PHP • MySQL • REST APIs</text>
    <rect x="14" y="84" width="196" height="8" rx="4" fill="#0D1117"/>
    <rect x="14" y="84" width="174" height="8" rx="4" fill="#FDE047">
      <animate attributeName="width" values="115;178;174" dur="3.8s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Card 4 -->
  <g transform="translate(750, 48)">
    <rect width="226" height="114" rx="10" fill="#161B22" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="14" y="24" font-family="monospace" font-size="11" font-weight="700" fill="#38BDF8">04 // APPLIED AI</text>
    <text x="14" y="46" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFF">DWT-MFCC • Scikit-Learn</text>
    <text x="14" y="64" font-family="sans-serif" font-size="12" fill="#94A3B8">Flask • Azure AI • SVM/RF</text>
    <rect x="14" y="84" width="198" height="8" rx="4" fill="#0D1117"/>
    <rect x="14" y="84" width="166" height="8" rx="4" fill="#38BDF8">
      <animate attributeName="width" values="105;172;166" dur="4.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="500" y="202" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8B949E">RAW DATA  ━━▶  CLEANING &amp; AUTOMATION  ━━▶  BI &amp; AI INSIGHTS  ━━▶  PRODUCTION WEB APPS</text>
</svg>

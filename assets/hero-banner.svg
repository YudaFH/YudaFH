  <g transform="translate(652, 28)">
    <rect x="0" y="0" width="310" height="224" rx="10" fill="#090D12" stroke="#30363D" stroke-width="1.2"/>
    <rect x="0" y="0" width="310" height="28" rx="10" fill="#161B22"/>
    <rect x="0" y="16" width="310" height="12" fill="#161B22"/>
    <circle cx="16" cy="14" r="4" fill="#484F58"/>
    <circle cx="30" cy="14" r="4" fill="#484F58"/>
    <circle cx="44" cy="14" r="4" fill="#484F58"/>
    <text x="155" y="18" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8B949E">yudafh.sh</text>

    <text x="16" y="52" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#10B981">$ whoami</text>
    <text x="16" y="70" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E6EDF3">Yuda Farid Habibie</text>

    <text x="16" y="96" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#10B981">$ cat experience.log</text>

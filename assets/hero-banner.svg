<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#111820"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="14" fill="url(#bgGrad)"/>
  <rect width="1000" height="280" rx="14" fill="url(#grid)"/>
  <circle cx="240" cy="120" r="220" fill="url(#orb1)">
    <animate attributeName="cx" values="220;310;220" dur="12s" repeatCount="indefinite"/>
  </circle>
  <rect x="1" y="1" width="998" height="278" rx="13" fill="none" stroke="#30363D" stroke-width="1.5"/>

  <!-- Left: Clean Executive Identity -->
  <text x="42" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="600" fill="#10B981" letter-spacing="1.4">DATA ANALYST  ·  WORKFLOW AUTOMATION  ·  FULL-STACK</text>
  <text x="42" y="96" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="40" font-weight="700" fill="#F0F6FC" letter-spacing="-0.8">Yuda Farid Habibie</text>
  <text x="42" y="128" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" fill="#8B949E">B.Sc. Informatics (GPA 3.78/4.00)  ·  Ex-IDX &amp; PT Bayer Indonesia</text>
  <text x="42" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#7D8590">Building BI systems, operational automation &amp; production web apps.</text>


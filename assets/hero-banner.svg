<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F14"/>
      <stop offset="55%" stop-color="#082820"/>
      <stop offset="100%" stop-color="#1C1512"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C94A29" stop-opacity="0.44"/>
      <stop offset="100%" stop-color="#C94A29" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="300" rx="16" fill="url(#grid)"/>

  <circle cx="200" cy="100" r="190" fill="url(#orb1)">
    <animate attributeName="cx" values="170;270;170" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;150;80" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="210" fill="url(#orb2)">
    <animate attributeName="cx" values="820;700;820" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="210;120;210" dur="8s" repeatCount="indefinite"/>
  </circle>

  <rect x="2" y="2" width="996" height="296" rx="15" fill="none" stroke="#30363D" stroke-width="2"/>


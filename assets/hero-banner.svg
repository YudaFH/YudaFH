    <text x="76" y="198" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#E6EDF3">active</text>
    <rect x="124" y="187" width="7" height="13" fill="#10B981">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

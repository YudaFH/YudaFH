<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#0B2E25"/>
      <stop offset="100%" stop-color="#1E1B18"/>
    </linearGradient>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C94A29" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#C94A29" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FDE047" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="280" rx="16" fill="url(#bgGrad)"/>
  <rect width="1000" height="280" rx="16" fill="url(#grid)"/>

  <!-- Animated Floating Orbs -->
  <circle cx="200" cy="90" r="190" fill="url(#orb1)">
    <animate attributeName="cx" values="180;280;180" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;140;80" dur="11s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="180" r="210" fill="url(#orb2)">
    <animate attributeName="cx" values="820;710;820" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="190;110;190" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="520" cy="140" r="150" fill="url(#orb3)">
    <animate attributeName="r" values="130;175;130" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Border Frame -->
  <rect x="2" y="2" width="996" height="276" rx="15" fill="none" stroke="#30363D" stroke-width="2"/>

  <!-- Live Status Pill -->
  <rect x="48" y="34" width="232" height="28" rx="14" fill="rgba(11,59,46,0.85)" stroke="#4ADE80" stroke-width="1.2"/>
  <circle cx="66" cy="48" r="5" fill="#4ADE80">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="80" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5" font-weight="700" fill="#F3EFE6">OPEN TO DATA &amp; FULL-STACK ROLES</text>

  <!-- Main Title -->
  <text x="48" y="116" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Yuda Farid Habibie.</text>
  <text x="48" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#FDE68A">Data Analyst  •  Workflow Automation  •  Full-Stack Developer</text>
  <text x="48" y="178" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" fill="#D6D3D1">B.Sc. Informatics (GPA 3.78/4.00)  |  Ex-Intern at Indonesia Stock Exchange (IDX) &amp; PT Bayer Indonesia</text>

  <!-- Interactive Metric Pills -->
  <g transform="translate(48, 206)">
    <rect x="0" y="0" width="160" height="44" rx="8" fill="#0B3B2E" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="14" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">3.78 / 4.00</text>
    <text x="14" y="36" font-family="monospace" font-size="10.5" fill="#FDE68A">GPA INFORMATICS</text>

    <rect x="174" y="0" width="175" height="44" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="188" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">IDX &amp; Bayer</text>
    <text x="188" y="36" font-family="monospace" font-size="10.5" fill="#A8A29E">CORPORATE INTERN</text>

    <rect x="363" y="0" width="170" height="44" rx="8" fill="#C94A29" stroke="#FDE047" stroke-width="1.2"/>
    <text x="377" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#FFFFFF">6+ Live Apps</text>
    <text x="377" y="36" font-family="monospace" font-size="10.5" fill="#FFFBEB">SAAS • AI • CLIENT</text>

    <rect x="547" y="0" width="215" height="44" rx="8" fill="#161B22" stroke="#FDE047" stroke-width="1.2"/>
    <text x="561" y="20" font-family="sans-serif" font-size="15" font-weight="800" fill="#FDE047">2x National Finalist</text>
    <text x="561" y="36" font-family="monospace" font-size="10.5" fill="#D6D3D1">BANK INDONESIA &amp; MS AI</text>
  </g>
</svg>

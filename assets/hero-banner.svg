  <text x="38" y="54" font-family="ui-monospace, Menlo, monospace" font-size="12" font-weight="700" fill="#C94A29" letter-spacing="1.4">DATA ANALYST  •  WORKFLOW AUTOMATION  •  FULL-STACK</text>
  <text x="38" y="106" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="46" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Yuda Farid Habibie.</text>
  <text x="38" y="142" font-family="-apple-system, sans-serif" font-size="14.5" fill="#D6D3D1">B.Sc. Informatics (GPA 3.78/4.00)  |  Ex-IDX &amp; PT Bayer Indonesia</text>
  <text x="38" y="166" font-family="ui-monospace, Menlo, monospace" font-size="12.5" fill="#FDE68A">Turning operational data &amp; manual workflows into clean BI &amp; web products.</text>

  <g transform="translate(38, 192)">
    <rect x="0" y="0" width="132" height="44" rx="8" fill="#0B3B2E" stroke="#4ADE80" stroke-width="1.2"/>
    <text x="12" y="20" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#FFF">3.78 / 4.00</text>
    <text x="12" y="36" font-family="monospace" font-size="10" fill="#FDE68A">GPA INFORMATICS</text>

    <rect x="142" y="0" width="138" height="44" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
    <text x="154" y="20" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#FFF">IDX &amp; Bayer</text>
    <text x="154" y="36" font-family="monospace" font-size="10" fill="#A8A29E">CORPORATE INTERN</text>

    <rect x="290" y="0" width="132" height="44" rx="8" fill="#C94A29" stroke="#FDE047" stroke-width="1.2"/>
    <text x="302" y="20" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#FFF">6+ Live Apps</text>
    <text x="302" y="36" font-family="monospace" font-size="10" fill="#FFFBEB">SAAS • AI • WEB</text>

    <rect x="432" y="0" width="152" height="44" rx="8" fill="#161B22" stroke="#FDE047" stroke-width="1.2"/>
    <text x="444" y="20" font-family="sans-serif" font-size="14.5" font-weight="800" fill="#FDE047">2x Finalist</text>
    <text x="444" y="36" font-family="monospace" font-size="10" fill="#D6D3D1">BI &amp; MICROSOFT AI</text>
  </g>
  <text x="38" y="268" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#94A3B8">Tangerang / Jakarta, Indonesia  •  https://yudafh.vercel.app</text>

  <!-- Right: Animated Live Terminal Card -->
  <g transform="translate(646, 30)">
    <rect x="0" y="0" width="318" height="240" rx="12" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
    <rect x="0" y="0" width="318" height="30" rx="12" fill="#161B22"/>
    <rect x="0" y="18" width="318" height="12" fill="#161B22"/>
    <circle cx="18" cy="15" r="5" fill="#EF4444"/>
    <circle cx="34" cy="15" r="5" fill="#F59E0B"/>
    <circle cx="50" cy="15" r="5" fill="#10B981"/>
    <text x="159" y="19" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#8B949E">yudafh.sh — profile</text>

    <text x="16" y="56" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#4ADE80">$ whoami</text>
    <text x="16" y="74" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#E6EDF3">&gt; Yuda Farid Habibie</text>

    <text x="16" y="100" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#4ADE80">$ cat impact.log</text>
    <text x="16" y="118" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#FDE68A">[IDX]   15 KP Audit + React/BI</text>
    <text x="16" y="136" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#FDE68A">[Bayer] VBA -30m/shift + PowerBI</text>
    <text x="16" y="154" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7DD3FC">[AI]    LungSphere Top-10 MS AI</text>
    <text x="16" y="172" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#FCA5A5">[SaaS]  Sahamara &amp; PintuAcara</text>

    <text x="16" y="202" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#4ADE80">$ status --live</text>
    <text x="16" y="222" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#FFFFFF">ready_to_build_impact</text>
    <rect x="172" y="211" width="8" height="14" fill="#FDE047">
      <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
    </rect>

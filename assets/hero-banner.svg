    <text x="12" y="37" font-family="monospace" font-size="9.5" fill="#8B949E">GPA INFORMATICS</text>

    <rect x="142" y="0" width="136" height="46" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="154" y="21" font-family="sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">IDX &amp; Bayer</text>
    <text x="154" y="37" font-family="monospace" font-size="9.5" fill="#8B949E">CORPORATE INTERN</text>

    <rect x="288" y="0" width="132" height="46" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="300" y="21" font-family="sans-serif" font-size="14" font-weight="700" fill="#10B981">6+ Live Apps</text>
    <text x="300" y="37" font-family="monospace" font-size="9.5" fill="#8B949E">SAAS · AI · CLIENT</text>

    <rect x="430" y="0" width="154" height="46" rx="8" fill="#161B22" stroke="#30363D" stroke-width="1"/>
    <text x="442" y="21" font-family="sans-serif" font-size="14" font-weight="700" fill="#F0F6FC">2× Finalist</text>
    <text x="442" y="37" font-family="monospace" font-size="9.5" fill="#8B949E">BI &amp; MICROSOFT AI</text>

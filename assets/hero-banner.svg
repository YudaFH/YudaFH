    <text x="16" y="132" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8B949E">[Bayer] VBA -30m/shift + PowerBI</text>
    <text x="16" y="150" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8B949E">[AI]    LungSphere Top-10 MS AI</text>
    <text x="16" y="168" font-family="ui-monospace, Menlo, monospace" font-size="10.5" fill="#8B949E">[SaaS]  Sahamara &amp; PintuAcara</text>

